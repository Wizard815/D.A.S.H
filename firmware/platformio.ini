; D.A.S.H firmware. Build: pio run   Flash: pio run -t upload   Tests: pio test -e native

[platformio]
default_envs = freenove_40

[env]
test_framework = unity

; Freenove ESP32 Display 4.0" (ESP32-WROOM-32E N4, ST7796 320x480, XPT2046).
; Pins come from docs/hardware.md. TFT_eSPI is configured here with flags, so
; the library's User_Setup.h is never edited.
[env:freenove_40]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
lib_deps =
  bodmer/TFT_eSPI@2.5.43
build_flags =
  -Wall
  -D USER_SETUP_LOADED=1
  -D ST7796_DRIVER=1
  -D TFT_WIDTH=320
  -D TFT_HEIGHT=480
  -D USE_HSPI_PORT=1
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=27
  -D TFT_BACKLIGHT_ON=HIGH
  -D TOUCH_CS=33
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_FONT7=1
  -D LOAD_GFXFF=1
  -D SMOOTH_FONT=1
  -D SPI_FREQUENCY=40000000
  -D SPI_READ_FREQUENCY=16000000
  -D SPI_TOUCH_FREQUENCY=2500000
  ; Set to 1 once the PTT button is wired to IO36 with a 10k pull-up.
  ; Until then IO36 floats and would read as random presses.
  -D DASH_HAS_PTT_BUTTON=0
  ; The RGB LED pins are planned for the mic and encoder (docs/hardware.md).
  ; Set to 0 when those are wired.
  -D DASH_RGB_LED=1

; Pure logic only (lib/dash_core), on this computer.
[env:native]
platform = native@1.2.1
build_flags = -std=c++17 -Wall
lib_compat_mode = off
lib_ignore = TFT_eSPI
test_build_src = no
