; Atlas bridge: an ESP32-C3 SuperMini next to the Atlas Pi.
;   Pi awake: relays dash-mod frames between the Pi's UART and ESP-NOW (DASH).
;   Pi off:   wakes now and then, looks for a home Wi-Fi name, and wakes the
;             Pi through the Witty Pi's switch line when there's data to sync.
;             Listens on Bluetooth for a signed remote start from the phone.
; Build: pio run   Flash: pio run -t upload   Docs: ../docs/mods/atlas.md
[platformio]
default_envs = c3_supermini

[env:c3_supermini]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@7.2.1
  h2zero/NimBLE-Arduino@1.4.2
build_flags =
  -Wall
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
