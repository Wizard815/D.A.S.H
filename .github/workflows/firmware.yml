name: firmware
on:
  push:
    paths: ["firmware/**", "bridge/**", "tools/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", "bridge/**", "tools/**", ".github/workflows/firmware.yml"]
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini', 'bridge/platformio.ini') }}
      - run: pip install platformio==6.1.18
      - name: Unit tests (host)
        run: pio test -e native
      - name: Build for the board
        run: pio run -e freenove_40
      - name: Build the Atlas bridge (ESP32-C3)
        working-directory: bridge
        run: pio run
      - name: Check the Atlas simulator script
        working-directory: tools
        run: bash -n atlas-sim.sh && bash -n atlas-sign.sh
